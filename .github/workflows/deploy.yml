name: Deploy to EC2

on:
  push:
    branches: [feature/rds-setup]
  pull_request:
    branches: [feature/rds-setup]
    types: [closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: goswamiaditya-gkmit/taskvault-backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 0 — Run unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CACHES_LOCATIONS: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          # Mocking external APIs for CI
          RAZORPAY_KEY_ID: rzp_test_fake
          RAZORPAY_KEY_SECRET: fake_secret
        run: |
          pytest --cov-fail-under=50

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build and push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [test]

    # Run on direct push OR on a merged PR
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to EC2
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          # ── GHCR Auth ────────────────────────────────────────────────────────
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_IMAGE: ghcr.io/goswamiaditya-gkmit/taskvault-backend:latest
          # ── New Relic APM ────────────────────────────────────────────────────
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_APP_NAME: ${{ secrets.NEW_RELIC_APP_NAME }}
          # ── Django ───────────────────────────────────────────────────────────
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          # ── PostgreSQL ───────────────────────────────────────────────────────
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          # ── Redis / Celery ───────────────────────────────────────────────────
          CACHES_LOCATIONS: redis://redis:6379/1
          CELERY_BROKER_URL: redis://redis:6379/2
          # ── Email ────────────────────────────────────────────────────────────
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          # ── Super Admin ──────────────────────────────────────────────────────
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_USERNAME: ${{ secrets.SUPER_ADMIN_USERNAME }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          # ── Razorpay ─────────────────────────────────────────────────────────
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          # ── URLs ─────────────────────────────────────────────────────────────
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          REGISTER_INVITE_LINK_PATH: ${{ secrets.REGISTER_INVITE_LINK_PATH }}
          # ── Domain & SSL ──────────────────────────────────────────────────────
          DOMAIN_NAME: taskvault.site
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >
            GHCR_TOKEN,GHCR_USER,DOCKER_IMAGE,
            NEW_RELIC_LICENSE_KEY,NEW_RELIC_APP_NAME,
            DJANGO_SECRET_KEY,
            POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_HOST,POSTGRES_PORT,
            CACHES_LOCATIONS,CELERY_BROKER_URL,
            EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,DEFAULT_FROM_EMAIL,
            SUPER_ADMIN_EMAIL,SUPER_ADMIN_USERNAME,SUPER_ADMIN_PASSWORD,
            RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET,
            FRONTEND_URL,BASE_URL,REGISTER_INVITE_LINK_PATH,
            DOMAIN_NAME,CERTBOT_EMAIL,POSTGRES_PORT
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/taskvault-backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # ─── 1. Bootstrap: Install Docker if missing ──────────────────────
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
                sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io \
                docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER
              echo "==> Docker installed successfully."
            else
              echo "==> Docker already present: $(docker --version)"
            fi

            # ─── 2. Clone or update repository ───────────────────────────────
            if [ ! -d "$APP_DIR" ]; then
              echo "==> Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin feature/rds-setup
            git checkout feature/rds-setup
            git reset --hard origin/feature/rds-setup

            # ─── 3. Write production .env ────────────────────────────────────
            echo "==> Writing .env..."
            > .env
            echo "NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}" >> .env
            echo "NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME}" >> .env
            echo "DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}" >> .env
            echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
            echo "POSTGRES_USER=${POSTGRES_USER}" >> .env
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
            echo "POSTGRES_HOST=${POSTGRES_HOST}" >> .env
            echo "POSTGRES_PORT=${POSTGRES_PORT}" >> .env
            echo "CACHES_LOCATIONS=${CACHES_LOCATIONS}" >> .env
            echo "CELERY_BROKER_URL=${CELERY_BROKER_URL}" >> .env
            echo "EMAIL_HOST_USER=${EMAIL_HOST_USER}" >> .env
            echo "EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}" >> .env
            echo "DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}" >> .env
            echo "SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}" >> .env
            echo "SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME}" >> .env
            echo "SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}" >> .env
            echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" >> .env
            echo "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" >> .env
            echo "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}" >> .env
            echo "FRONTEND_URL=${FRONTEND_URL}" >> .env
            echo "BASE_URL=${BASE_URL}" >> .env
            echo "REGISTER_INVITE_LINK_PATH=${REGISTER_INVITE_LINK_PATH}" >> .env
            echo "POSTGRES_PORT=${POSTGRES_PORT}" >> .env

            # ─── 4. Login to GHCR and pull latest image ───────────────────────
            echo "==> Logging in to GHCR..."
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling latest image: $DOCKER_IMAGE"
            sudo docker pull "$DOCKER_IMAGE"

            # Inject DOCKER_IMAGE into .env for docker-compose substitution
            echo "DOCKER_IMAGE=${DOCKER_IMAGE}" >> .env

            # ─── 5. Smart SSL: check if cert already exists ─────────────────
            CERT_PATH="/var/lib/docker/volumes/taskvault-backend_certbot_certs/_data/live/${DOMAIN_NAME}/fullchain.pem"

            if sudo test -f "$CERT_PATH"; then
              # ── Certs exist → start everything with HTTPS ──────────────────
              echo "==> SSL certificates found. Starting with HTTPS config..."
              sudo docker compose down
              sudo DOCKER_IMAGE="$DOCKER_IMAGE" docker compose up -d

            else
              # ── No certs → use standalone certbot ────────────────────────
              echo "==> No SSL certificates found. Provisioning via standalone certbot..."

              # Free port 80: stop Docker nginx + any system-level web server
              sudo docker compose stop nginx || true
              sudo systemctl stop nginx 2>/dev/null || true
              sudo systemctl stop apache2 2>/dev/null || true
              # Kill any remaining process on port 80 (host-level)
              sudo fuser -k 80/tcp 2>/dev/null || true
              sleep 2

              echo "==> Port 80 is free. Requesting Let's Encrypt certificate for ${DOMAIN_NAME}..."
              sudo docker run --rm \
                -p 80:80 \
                -v taskvault-backend_certbot_certs:/etc/letsencrypt \
                certbot/certbot certonly \
                --standalone \
                --non-interactive \
                --email "${CERTBOT_EMAIL}" \
                --agree-tos \
                --no-eff-email \
                -d "${DOMAIN_NAME}"

              echo "==> Certificate obtained! Starting full stack with HTTPS..."
              sudo DOCKER_IMAGE="$DOCKER_IMAGE" docker compose up -d
            fi



            # ─── 6. Cleanup old images ────────────────────────────────────────
            sudo docker image prune -f

            echo "==> Deployment complete! Site live at https://${DOMAIN_NAME}"
