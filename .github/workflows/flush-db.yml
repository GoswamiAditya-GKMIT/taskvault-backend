name: Flush Production Database (DANGER)

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  flush-db:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Flush Django Database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USER }}/taskvault-backend"
            cd "$APP_DIR"
            
            echo "==> Warning: Permanently wiping all data from the database..."
            sudo docker compose exec -T web python manage.py flush --noinput
            
            echo "==> Re-seeding superadmin user..."
            sudo docker compose exec -T web python manage.py seed_superadmin
            
            echo "==> Database successfully reset!"
