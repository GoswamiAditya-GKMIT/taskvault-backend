services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: taskvault_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persisted forever — never wiped on redeploy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taskvault_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Django / Gunicorn ────────────────────────────────────────────────────────
  web:
    image: ${DOCKER_IMAGE:-taskvault-backend:local}
    container_name: taskvault_web
    env_file: .env
    environment:
      SERVICE: web
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CACHES_LOCATIONS: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
      - app_logs:/app/logs
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery_worker:
    image: ${DOCKER_IMAGE:-taskvault-backend:local}
    container_name: taskvault_celery_worker
    env_file: .env
    environment:
      SERVICE: celery_worker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CACHES_LOCATIONS: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped

  # ── Celery Beat ──────────────────────────────────────────────────────────────
  celery_beat:
    image: ${DOCKER_IMAGE:-taskvault-backend:local}
    container_name: taskvault_celery_beat
    env_file: .env
    environment:
      SERVICE: celery_beat
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CACHES_LOCATIONS: "redis://redis:6379/1"
      CELERY_BROKER_URL: "redis://redis:6379/2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    restart: unless-stopped

  # ── Nginx (reverse proxy + SSL termination) ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: taskvault_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

  # ── Certbot (one-shot — no entrypoint, no restart) ─────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: taskvault_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:     # database — never deleted by CI/CD
  static_files:      # shared between web and nginx
  app_logs:          # shared log files
  certbot_webroot:   # ACME challenge files
  certbot_certs:     # Let's Encrypt certificates