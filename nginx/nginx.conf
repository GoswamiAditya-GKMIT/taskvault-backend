# nginx.conf — Production (HTTPS + HTTP redirect)
# This is the active config. During first SSL provisioning,
# the pipeline temporarily swaps this with nginx.http-only.conf.

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name taskvault.site www.taskvault.site;

    # ACME challenge must remain accessible over HTTP (for cert renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name taskvault.site www.taskvault.site;

    ssl_certificate     /etc/letsencrypt/live/taskvault.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskvault.site/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    client_max_body_size 20M;

    # Static files served directly by Nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # All API/app traffic → Gunicorn
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
