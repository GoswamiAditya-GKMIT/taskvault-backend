# The deploy pipeline swaps to this file, gets the cert, then restores nginx.conf.

# Default server (Catch-all) - Drops any request not addressed to our domain
server {
    listen 80 default_server;
    server_name _;
    return 444; # Connection closed without response
}

server {
    listen 80;
    server_name taskvault.site www.taskvault.site;

    # 1. Block common bot probes
    location ~* ^/(wp-admin|wordpress|phpmyadmin|xmlrpc\.php|wp-login\.php|\.env|\.git|\.well-known/security\.txt) {
        return 444; 
    }

    client_max_body_size 20M;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Forward all traffic to Django (HTTP)
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 120s;
    }
}
